<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MTTs Tricking Lab</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B71C1C">

  <style>
    :root{--bg:#071026;--card:#0b1220;--accent:#f59e0b;--muted:#9aa4b2;--glass:rgba(255,255,255,0.03);--height:100vh}
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#e6eef6}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#151922 0%, #071026 100%)}
    .app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column}

    .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));backdrop-filter:blur(6px)}
    .title{font-weight:700;font-size:15px}
    .subtitle{font-size:12px;color:var(--muted)}
    .timer{background:var(--glass);padding:6px 10px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}

    .pager{flex:1;position:relative;overflow:hidden}
    .blocks{display:flex;height:100%;transition:transform .28s ease;will-change:transform}
    .block{min-width:100%;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:12px;flex:0 0 auto}

    .block-head{display:flex;justify-content:space-between;align-items:flex-start}
    .block-head .info{max-width:65%}
    .block-title{font-size:18px;margin:0}
    .block-sub{font-size:13px;color:var(--muted);margin-top:6px}
    .block-meta{text-align:right;font-size:12px;color:var(--muted)}

    .video-row{display:flex;gap:8px;overflow:auto;padding-top:6px}
    .thumb{min-width:100px;border-radius:8px;overflow:hidden;background:#000}
    .thumb video{width:100px;height:72px;display:block}

    .bottombar{height:72px;padding:10px 12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));display:flex;align-items:center;gap:10px}
    .btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;background:linear-gradient(180deg,var(--accent),#d97706);color:#08111a}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-weight:700}

    .progress{height:6px;background:rgba(255,255,255,0.04);border-radius:8px;overflow:hidden;margin-top:6px}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#f97316);width:0%}

    .small{font-size:13px;color:var(--muted)}
    video{width:100%;border-radius:8px;}
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="MTTs Tricking Lab">

    <div class="topbar">
      <div>
        <div class="title">MTTs Tricking Lab</div>
        <div class="subtitle small">3× / Woche · ~23 Min · Einbeiniger Pop + Arm Swing</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="timer" class="timer">00:00</div>
      </div>
    </div>

    <main class="pager" id="pager">
      <div class="blocks" id="blocks">
        <p>Bereit? Drücke "Training starten" um zu beginnen.</p>
      </div>
    </main>

    <div style="padding:10px 12px">
      <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
    </div>

    <nav class="bottombar" role="navigation" aria-label="Steuerung">
      <button id="startBtn" class="btn">Training starten</button>
      <button id="nextBtn" class="btn ghost" style="display:none">Nächstes</button>
    </nav>

<script>
let trainingSteps = [
  {
    title: "Warm-Up",
    duration: 180,
    exercises: [
      { name: "A-Skip", desc: "2×20 m A-Skips" },
      { name: "Leg Swings", desc: "10 Leg Swings pro Bein (vor/zurück)" },
      { name: "Arm Swings", desc: "10 explosive Arm Swings (ohne Gewicht)" }
    ],
    videos: ["askip.mp4"]
  },
  {
    title: "Block A – Strength",
    duration: 360,
    exercises: [
      { name: "Bulgarian Split Squat", desc: "3 Sätze × 5 pro Bein" },
      { name: "Info", desc: "Kurzhantel in der Hand der Sprungbein-Seite · Pause 60-90 Sekunden" }
    ],
    videos: ["bulgarian.mp4"]
  },
  {
    title: "Block B – Plyo Pop",
    duration: 480,
    exercises: [
      { name: "Explosive Step Up", desc: "3 Sätze × 3 pro Bein (max. Geschwindigkeit)" },
      { name: "Single Leg Hops", desc: "2 Sätze × 20 m (schnelle Kontakte, nicht hoch)" }
    ],
    videos: ["stepups.mp4"]
  },
  {
    title: "Block C – Arm Swing Power",
    duration: 180,
    exercises: [
      { name: "Explosive Arm Swings", desc: "3×15 (mit 1.5kg an den Handgelenken)" },
      { name: "Cork Setup Pop", desc: "3×5 (nur Pop, keine Rotation)" }
    ],
    videos: []
  },
  {
    title: "Block D – Knee Prehab",
    duration: 180,
    exercises: [
      { name: "Tibialis Raises", desc: "25 Wiederholungen" },
      { name: "Sissy Knee Drives (kleine Range)", desc: "20 Wiederholungen" },
      { name: "Calf Eccentrics", desc: "8 pro Bein (einbeinig)" }
    ],
    videos: ["tib.mp4","sissy.mp4","calf.mp4"]
  }
];

const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const blocksEl = document.getElementById('blocks');
const progressBar = document.getElementById('progressBar');
const timerEl = document.getElementById('timer');

let currentStep = 0;
let timerInterval = null;
let totalTime = 0;
trainingSteps.forEach(step => totalTime += step.duration);
let elapsedTime = 0;

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    elapsedTime++;
    timerEl.textContent = formatTime(elapsedTime);
    if(elapsedTime >= totalTime){
      clearInterval(timerInterval);
    }
  },1000);
}

function showStep(stepIndex){
  const step = trainingSteps[stepIndex];
  let html = `<div class="block">
                <div class="block-head">
                  <div class="info">
                    <h2 class="block-title">${step.title}</h2>
                  </div>
                </div>`;
  step.exercises.forEach(ex => {
    html += `<h3>${ex.name}</h3><p>${ex.desc}</p>`;
  });
  if(step.videos.length > 0){
    html += `<div class="video-row">`;
    step.videos.forEach(v => {
      html += `<div class="thumb"><video src="${v}" controls></video></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  blocksEl.innerHTML = html;

  const progressPercent = ((stepIndex+1)/trainingSteps.length)*100;
  progressBar.style.width = progressPercent+"%";
}

startBtn.addEventListener("click", ()=>{
  currentStep = 0;
  elapsedTime = 0;
  startTimer();
  showStep(currentStep);
  startBtn.style.display = "none";
  nextBtn.style.display = "block";
});

nextBtn.addEventListener("click", ()=>{
  currentStep++;
  if(currentStep < trainingSteps.length){
    showStep(currentStep);
  } else {
    alert("Training abgeschlossen!");
    nextBtn.style.display = "none";
    startBtn.style.display = "block";
    blocksEl.innerHTML = "<p>Bereit? Drücke \"Training starten\" um zu beginnen.</p>";
    progressBar.style.width = "0%";
    timerEl.textContent = "00:00";
    elapsedTime = 0;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').then(reg=>{
      console.log('Service Worker registered.');
    }).catch(err=>console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
