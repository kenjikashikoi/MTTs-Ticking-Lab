<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTTs Dojo Lab</title>

<!-- PWA Manifest & Apple -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2b1e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Google Font: Noto Sans SC für Dojo-Flair -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#2b1e0f;       /* dunkles Holz */
  --card:#3b2a16;     /* helleres Holz */
  --accent:#d4af37;   /* Gold */
  --muted:#f5e3c0;    /* Pergament */
  --glass:rgba(255,255,255,0.05);
}

*{box-sizing:border-box;font-family:'Noto Sans SC',sans-serif;color:var(--muted);margin:0;padding:0;}
html,body{height:100%;background:linear-gradient(180deg,#3b2a16 0%,#2b1e0f 100%)}
.app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column}

.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,0.2);backdrop-filter:blur(4px)}
.title{font-weight:700;font-size:18px;color:var(--accent)}
.subtitle{font-size:12px;color:var(--muted)}
.timer{background:var(--glass);padding:6px 10px;border-radius:10px;font-weight:700;font-size:13px;color:var(--accent)}

.pager{flex:1;position:relative;overflow-y:auto;padding:12px}
.blocks{display:flex;flex-direction:column;gap:14px;transition:transform .28s ease;will-change:transform}

.block-card{
  background: linear-gradient(180deg, rgba(212,175,55,0.08), rgba(59,42,22,0.08));
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.block-header{display:flex;justify-content:space-between;align-items:flex-start}
.block-title{font-weight:700;font-size:18px;color:var(--accent)}
.block-meta{font-size:12px;color:var(--muted)}
.block-subtitle{font-size:13px;color:var(--muted);margin-bottom:6px}

.exercise{display:flex;flex-direction:column;gap:2px}
.exercise-title{font-weight:600;font-size:14px;color:#ffd700}
.exercise-desc{font-size:12px;color:var(--muted)}

.progress{height:6px;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#d4af37,#ffd700);width:0%}

.video-row{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.video-row video{width:100%;max-height:180px;height:auto;border-radius:8px;border:2px solid var(--accent)}

.bottombar{height:72px;padding:10px 12px;background:rgba(0,0,0,0.2);display:flex;align-items:center;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;background:linear-gradient(180deg,#d4af37,#a67c00);color:#2b1e0f}
.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app" role="application" aria-label="MTTs Dojo Lab">

<div class="topbar">
  <div>
    <div class="title">MTTs Dojo Lab</div>
    <div class="subtitle small">3× / Woche · ~23 Min · Einbeiniger Pop + Arm Swing</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div id="timer" class="timer">00:00</div>
  </div>
</div>

<main class="pager" id="pager">
  <div class="blocks" id="blocks">
    <p>Bereit? Drücke "Training starten" um zu beginnen.</p>
  </div>
</main>

<div style="padding:10px 12px">
  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
</div>

<nav class="bottombar" role="navigation" aria-label="Steuerung">
  <button id="startBtn" class="btn">Training starten</button>
  <button id="nextBtn" class="btn ghost" style="display:none">Nächstes</button>
</nav>

<script>
let trainingSteps=[
  {title:"Warm-Up",duration:180,exercises:[{name:"A-Skip",desc:"2×20 m A-Skips"},{name:"Leg Swings",desc:"10 Leg Swings pro Bein (vor/zurück)"},{name:"Arm Swings",desc:"10 explosive Arm Swings (ohne Gewicht)"}],videos:["askip.mp4"]},
  {title:"Block A – Strength",duration:360,exercises:[{name:"Bulgarian Split Squat",desc:"3 Sätze × 5 pro Bein"},{name:"Info",desc:"Kurzhantel in der Hand der Sprungbein-Seite · Pause 60-90 Sekunden"}],videos:["bulgarian.mp4"]},
  {title:"Block B – Plyo Pop",duration:480,exercises:[{name:"Explosive Step Up",desc:"3 Sätze × 3 pro Bein (max. Geschwindigkeit)"},{name:"Single Leg Hops",desc:"2 Sätze × 20 m (schnelle Kontakte, nicht hoch)"}],videos:["stepups.mp4"]},
  {title:"Block C – Arm Swing Power",duration:180,exercises:[{name:"Explosive Arm Swings",desc:"3×15 (mit 1.5kg an den Handgelenken)"},{name:"Cork Setup Pop",desc:"3×5 (nur Pop, keine Rotation)"}],videos:[]},
  {title:"Block D – Knee Prehab",duration:180,exercises:[{name:"Tibialis Raises",desc:"25 Wiederholungen"},{name:"Sissy Knee Drives (kleine Range)",desc:"20 Wiederholungen"},{name:"Calf Eccentrics",desc:"8 pro Bein (einbeinig)"}],videos:["tib.mp4","sissy.mp4","calf.mp4"]}
];

const startBtn=document.getElementById('startBtn');
const nextBtn=document.getElementById('nextBtn');
const blocksEl=document.getElementById('blocks');
const progressBar=document.getElementById('progressBar');
const timerEl=document.getElementById('timer');

let currentStep=0;
let timerInterval=null;
let totalTime=0;
trainingSteps.forEach(s=>totalTime+=s.duration);
let elapsedTime=0;

function formatTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0');const s=(sec%60).toString().padStart(2,'0');return`${m}:${s}`}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    elapsedTime++;
    timerEl.textContent=formatTime(elapsedTime);
    if(elapsedTime>=totalTime) clearInterval(timerInterval);
  },1000);
}

function showStep(stepIndex){
  const step=trainingSteps[stepIndex];
  const subTitle=step.exercises.map(e=>e.name.split('(')[0].trim()).join(' · ');
  let html=`<div class="block-card">
              <div class="block-header">
                <div class="block-title">${step.title} (~${Math.ceil(step.duration/60)} min)</div>
                <div class="block-meta">Block ${stepIndex+1}/${trainingSteps.length} — ~${Math.ceil(step.duration/60)} min</div>
              </div>
              <div class="block-subtitle">${subTitle}</div>`;

  step.exercises.forEach(ex=>{
    html+=`<div class="exercise">
             <div class="exercise-title">${ex.name}</div>
             <div class="exercise-desc">${ex.desc}</div>
           </div>`;
  });

  if(step.videos.length>0){
    html+=`<div class="video-row">`;
    step.videos.forEach(v=>{html+=`<video src="${v}" controls></video>`});
    html+=`</div>`;
  }

  html+=`<div class="progress"><i style="width:${((stepIndex+1)/trainingSteps.length)*100}%"></i></div></div>`;
  blocksEl.innerHTML=html;
}

startBtn.addEventListener("click",()=>{
  currentStep=0;elapsedTime=0;startTimer();showStep(currentStep);
  startBtn.style.display="none";nextBtn.style.display="block";
});

nextBtn.addEventListener("click",()=>{
  currentStep++;
  if(currentStep<trainingSteps.length){showStep(currentStep)}
  else{
    alert("Training abgeschlossen!");
    nextBtn.style.display="none";
    startBtn.style.display="block";
    blocksEl.innerHTML="<p>Bereit? Drücke \"Training starten\" um zu beginnen.</p>";
    progressBar.style.width="0%";timerEl.textContent="00:00";elapsedTime=0;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').then(r=>console.log('SW registered')).catch(e=>console.log('SW failed',e))});
}
</script>
</body>
</html>
